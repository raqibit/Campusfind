services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - campusfind_mongo:/data/db
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-campusfind}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-change-this-local-minio-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - campusfind_objects:/data

volumes:
  campusfind_mongo:
  campusfind_objects:
