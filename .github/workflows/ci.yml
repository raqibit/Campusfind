name: CampusFind CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check live storage smoke-test syntax
        run: node --check scripts/minio-storage-smoke-test.mjs
      - name: Lint
        run: npm run lint
      - name: Build API
        run: npm run server:build
      - name: Test matching logic
        run: npm run server:test
      - name: Build web app
        run: npm run build
